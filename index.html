<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X | O</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            background: #404258;
            padding: 1rem;
            flex-wrap: wrap;
        }

        .container {
            width: 100%;
            max-width: 500px;
            order: 2;
        }

        .container h2 {
            font-size: clamp(1.5rem, 5vw, 2.8rem);
            font-weight: 700;
            text-align: center;
            padding: 1rem;
            color: #fff;
            margin-bottom: 1rem;
        }

        .container .squares {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            max-width: 350px;
            margin: 0 auto;
            aspect-ratio: 1;
        }

        .container .squares div {
            background: #fff;
            cursor: pointer;
            font-size: clamp(2rem, 8vw, 5rem);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #50577a;
            border-radius: 12px;
            transition: all 0.3s ease;
            aspect-ratio: 1;
            min-height: 60px;
        }

        .container .squares div:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .player-1,
        .player-2 {
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            border-radius: 12px;
            padding: 1rem;
            min-width: 120px;
            min-height: 120px;
            flex: 1;
            max-width: 150px;
        }

        .player-1 {
            order: 1;
        }

        .player-2 {
            order: 3;
        }

        .player-1 h1,
        .player-2 h1 {
            color: #50577a;
            font-size: clamp(1rem, 3vw, 1.8rem);
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .player-1 p,
        .player-2 p {
            font-size: clamp(1.5rem, 5vw, 3rem);
            font-weight: 600;
            color: #50577a;
        }

        .disable {
            pointer-events: none;
            opacity: 0.8;
        }

        .button-container {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .play-again-btn,
        .reset-score-btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: clamp(0.9rem, 2.5vw, 1rem);
            font-weight: 600;
            transition: all 0.3s ease;
            min-width: 120px;
        }

        .play-again-btn {
            background-color: #4CAF50;
            color: #fff;
        }

        .play-again-btn:hover {
            background-color: #3e8e41;
            transform: translateY(-2px);
        }

        .reset-score-btn {
            background-color: #FF0000;
            color: #fff;
        }

        .reset-score-btn:hover {
            background-color: #FF3737;
            transform: translateY(-2px);
        }

        /* Mobile styles - both portrait and landscape under 769px */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
                align-items: stretch;
            }

            /* Score container at top */
            .scores-container {
                display: flex;
                gap: 1rem;
                width: 100%;
                order: 1;
            }

            .player-1,
            .player-2 {
                order: unset;
                max-width: none;
                width: 100%;
                flex: 1;
                flex-direction: row;
                justify-content: space-between;
                padding: 1rem 1.5rem;
                margin-bottom: 0;
                min-height: 80px;
            }

            .player-1 h1,
            .player-2 h1 {
                margin-bottom: 0;
                font-size: clamp(1rem, 4vw, 1.3rem);
            }

            .player-1 p,
            .player-2 p {
                font-size: clamp(1.3rem, 5vw, 2rem);
            }

            .container {
                order: 2;
                width: 100%;
            }

            .container h2 {
                font-size: clamp(1.3rem, 5vw, 2rem);
                padding: 0.5rem;
                margin-bottom: 1rem;
            }

            .container .squares {
                max-width: 300px;
                gap: 0.4rem;
            }

            .container .squares div {
                font-size: clamp(2.5rem, 8vw, 4rem);
                min-height: 70px;
            }

            .button-container {
                flex-direction: row;
                gap: 1rem;
                margin-top: 1.5rem;
                justify-content: center;
            }

            .play-again-btn,
            .reset-score-btn {
                flex: 1;
                max-width: 150px;
                font-size: clamp(0.9rem, 3vw, 1rem);
            }
        }

        /* Very small screens */
        @media (max-width: 480px) {
            body {
                padding: 0.5rem;
                gap: 0.5rem;
            }

            .scores-container {
                gap: 0.5rem;
            }

            .player-1,
            .player-2 {
                padding: 0.8rem 1rem;
                min-height: 60px;
            }

            .player-1 h1,
            .player-2 h1 {
                font-size: clamp(0.9rem, 4vw, 1.1rem);
            }

            .player-1 p,
            .player-2 p {
                font-size: clamp(1.2rem, 5vw, 1.5rem);
            }

            .container h2 {
                font-size: clamp(1.1rem, 5vw, 1.5rem);
                padding: 0.5rem;
            }

            .container .squares {
                max-width: 260px;
                gap: 0.3rem;
            }

            .container .squares div {
                font-size: clamp(2rem, 8vw, 3rem);
                min-height: 60px;
            }

            .button-container {
                flex-direction: column;
                gap: 0.5rem;
            }

            .play-again-btn,
            .reset-score-btn {
                width: 100%;
                max-width: 200px;
                margin: 0 auto;
            }
        }

        /* Tablet and Desktop styles */
        @media (min-width: 769px) {
            body {
                flex-direction: row;
                gap: 2rem;
                align-items: center;
                justify-content: center;
            }

            .scores-container {
                display: contents;
            }

            .player-1 {
                order: 1;
            }

            .container {
                order: 2;
            }

            .player-2 {
                order: 3;
            }

            .player-1,
            .player-2 {
                flex-direction: column;
                justify-content: center;
                width: auto;
                max-width: 150px;
                min-height: 120px;
            }

            .player-1 h1,
            .player-2 h1 {
                margin-bottom: 0.5rem;
            }
        }

        /* Touch device optimizations */
        @media (hover: none) and (pointer: coarse) {
            .container .squares div:hover {
                transform: none;
                box-shadow: none;
            }

            .container .squares div:active {
                transform: scale(0.95);
                background-color: #f0f0f0;
            }

            .play-again-btn:hover,
            .reset-score-btn:hover {
                transform: none;
            }

            .play-again-btn:active {
                transform: scale(0.95);
            }

            .reset-score-btn:active {
                transform: scale(0.95);
            }
        }

        /* High DPI screens */
        @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
            .container .squares div {
                border: 1px solid rgba(80, 87, 122, 0.1);
            }
        }
    </style>
</head>
<body>
    <div class="scores-container">
        <div class="player-1">
            <h1>X-Score</h1>
            <p>0</p>
        </div>
        <div class="player-2">
            <h1>O-Score</h1>
            <p>0</p>
        </div>
    </div>
    
    <div class="container">
        <h2 class="title">TIC-TAC-TOE (X/O) Game</h2>
        <div class="squares">
            <div id="box1" onclick="game(this.id)"></div>
            <div id="box2" onclick="game(this.id)"></div>
            <div id="box3" onclick="game(this.id)"></div>
            <div id="box4" onclick="game(this.id)"></div>
            <div id="box5" onclick="game(this.id)"></div>
            <div id="box6" onclick="game(this.id)"></div>
            <div id="box7" onclick="game(this.id)"></div>
            <div id="box8" onclick="game(this.id)"></div>
            <div id="box9" onclick="game(this.id)"></div>
        </div>
        <div class="button-container">
            <button class="play-again-btn" onclick="resetGame()">Play Again</button>
            <button class="reset-score-btn" onclick="resetScore()">Reset Score</button>
        </div>
    </div>

    <script>
        let title = document.querySelector('.title');
        let currentPlayer = 'x';
        let squares = [];

        let player1 = document.querySelector('.player-1 p');
        let player2 = document.querySelector('.player-2 p');
        let score = { X: 0, O: 0 };

        function winner(num1, num2, num3) {
            title.innerHTML = `${squares[num1].toUpperCase()} Is the winner`;
            document.getElementById('box' + num1).style.background = '#6B728E';
            document.getElementById('box' + num2).style.background = '#6B728E';
            document.getElementById('box' + num3).style.background = '#6B728E';

            if (`${squares[num1]}` === 'x') {
                score.X += 1;
                player1.innerHTML = score.X;
            } else if (`${squares[num1]}` === 'o') {
                score.O += 1;
                player2.innerHTML = score.O;
            }

            disable();
            setTimeout(function() { resetGame(num1, num2, num3) }, 1500);
        }

        function checkDraw() {
            let filled = 0;
            for (let i = 1; i < 10; i++) {
                if (squares[i] !== '') filled++;
            }
            if (filled === 9) {
                title.innerHTML = "It's a Draw!";
                setTimeout(function() { resetGame() }, 1500);
                return true;
            }
            return false;
        }

        function check() {
            for (let i = 1; i < 10; i++) {
                squares[i] = document.getElementById('box' + i).innerHTML;
            }

            // Check rows
            if (squares[1] == squares[2] && squares[2] == squares[3] && squares[1] != '') {
                winner(1, 2, 3)
            } else if (squares[4] == squares[5] && squares[5] == squares[6] && squares[4] != '') {
                winner(4, 5, 6)
            } else if (squares[7] == squares[8] && squares[8] == squares[9] && squares[7] != '') {
                winner(7, 8, 9)
            }
            // Check columns
            else if (squares[1] == squares[4] && squares[4] == squares[7] && squares[1] != '') {
                winner(1, 4, 7)
            } else if (squares[2] == squares[5] && squares[5] == squares[8] && squares[2] != '') {
                winner(2, 5, 8)
            } else if (squares[3] == squares[6] && squares[6] == squares[9] && squares[3] != '') {
                winner(3, 6, 9)
            }
            // Check diagonals
            else if (squares[1] == squares[5] && squares[5] == squares[9] && squares[1] != '') {
                winner(1, 5, 9)
            } else if (squares[3] == squares[5] && squares[5] == squares[7] && squares[3] != '') {
                winner(3, 5, 7)
            }
            // Check for draw
            else {
                checkDraw();
            }
        }

        function game(id) {
            let element = document.getElementById(id);

            if (currentPlayer === 'x' && element.innerHTML === '') {
                element.innerHTML = 'x';
                currentPlayer = 'o'
                title.innerHTML = 'O: Turn'
            } else if (currentPlayer === 'o' && element.innerHTML === '') {
                element.innerHTML = 'o';
                currentPlayer = 'x';
                title.innerHTML = 'X: Turn'
            }

            check();
        }

        function resetGame() {
            for (let i = 1; i < 10; i++) {
                document.getElementById('box' + i).innerHTML = '';
                document.getElementById('box' + i).style.background = '#fff';
                document.getElementById('box' + i).classList.remove("disable");
            }
            title.innerHTML = 'X: Turn'
            currentPlayer = 'x';
        }

        function resetScore() {
            score.X = 0;
            score.O = 0;
            player1.innerHTML = score.X;
            player2.innerHTML = score.O;
        }

        function disable() {
            for (let i = 1; i < 10; i++) {
                document.getElementById('box' + i).classList.add("disable");
            }
        }

        // Add touch event handling for better mobile experience
        document.addEventListener('DOMContentLoaded', function() {
            const squares = document.querySelectorAll('.squares div');
            squares.forEach(square => {
                square.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                }, { passive: false });
            });
        });
    </script>
</body>
</html>
